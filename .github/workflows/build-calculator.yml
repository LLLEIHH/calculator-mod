name: Build Calculator (x64)

# 本机缺少 VS 的 UWP 工作负载时，可用 GitHub Actions 的 windows-2022 运行器编译：
# 该镜像自带 VS2022 + 「通用 Windows 平台开发」工作负载，无需本地安装任何东西。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: cmd
        run: msbuild src\Calculator\Calculator.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build Calculator (Release x64)
        id: build
        shell: cmd
        continue-on-error: true
        run: msbuild src\Calculator\Calculator.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false /m /flp:LogFile=build.log;Verbosity=Normal

      - name: 提取编译错误
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) {
            Write-Host "未找到 build.log"
            exit 0
          }
          $errs = Select-String -Path build.log -Pattern ':\s*error\s' | Select-Object -First 40
          if ($errs) {
            $errs | ForEach-Object { Write-Host ("::error::" + $_.Line.Trim()) }
          } else {
            Write-Host "build.log 里没有 error 行"
          }
          Write-Host "==== 日志末尾 40 行 ===="
          Get-Content build.log -Tail 40 | ForEach-Object { Write-Host $_ }

      - name: Upload package
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: Calculator-x64-Release
          path: |
            src\Calculator\AppPackages\**
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 失败即中断
        if: steps.build.outcome == 'failure'
        shell: cmd
        run: exit 1
